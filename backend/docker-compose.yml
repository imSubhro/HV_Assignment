services:
  db:
    image: postgres:16-alpine
    container_name: community-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: community_db
    ports:
      - "5433:5432"
    volumes:
      - community_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d community_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  community_pgdata:
